<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Q&A</title>
    <style>
        /* Basic Styling */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f4;
        }

        header {
            background-color: #FAFAFA;
            color: #0C0C0C;
            padding: 1rem;
            text-align: center;
        }

        /* Chat Area */
        #chatbox {
            flex-grow: 1; /* Takes up available space */
            overflow-y: auto; /* Enables scrolling */
            padding: 1rem;
            border-bottom: 1px solid #ccc;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 70%;
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
            border-radius: 10px;
            line-height: 1.4;
            word-wrap: break-word; /* Prevents long words from overflowing */
        }

        .user-message {
            background-color: #e9e9eb;
            align-self: flex-end; /* Right align user messages */
            border-bottom-right-radius: 0;
            margin-left: auto; /* Push to the right */
        }

        .bot-message {
            background-color: #e9e9eb;
            align-self: flex-start; /* Left align bot messages */
            border-bottom-left-radius: 0;
            margin-right: auto; /* Push to the left */
        }

         .error-message {
            background-color: #ffdddd;
            color: #d8000c;
            align-self: center; /* Center error messages */
            font-style: italic;
         }

        /* Input Area */
        #input-area {
            display: flex;
            padding: 1rem;
            background-color: #f4f4f4;
            border-top: 1px solid #ccc;
        }

        #user-input {
            flex-grow: 1;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 0.5rem;
            font-size: 1rem;
        }

        #send-button {
            padding: 0.8rem 1.5rem;
            background-color: #0C0C0C;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }

        #send-button:hover {
            background-color: #49a14d;
        }

        #send-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ask About Your Documents</h1>
    </header>

    <div id="chatbox">
        <div class="message bot-message">Hello! Ask me anything.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your question here...">
        <button id="send-button">Send</button>
    </div>

    <script>
        // Get DOM Elements
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // --- Functions ---

        // Function to add a message to the chatbox
        function addMessage(messageText, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            if (sender === 'user') {
                messageDiv.classList.add('user-message');
            } else if (sender === 'bot') {
                messageDiv.classList.add('bot-message');
            } else { // For errors or system messages
                 messageDiv.classList.add('error-message');
            }

            // Sanitize text slightly to prevent basic HTML injection (more robust sanitation needed for production)
            const textNode = document.createTextNode(messageText);
            messageDiv.appendChild(textNode);

            chatbox.appendChild(messageDiv);

            // Scroll to the bottom
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        // Function to handle sending the message
        async function sendMessage() {
            const query = userInput.value.trim();

            if (!query) {
                return; // Don't send empty messages
            }

            // Display user's message immediately
            addMessage(query, 'user');

            // Clear the input field
            userInput.value = '';
            // Disable input/button while waiting for response
            userInput.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = '...'; // Indicate loading

            try {
                // --- THIS IS WHERE YOU CALL YOUR BACKEND ---
                // Assumes your Python backend is running and has an endpoint at '/ask'
                // that accepts POST requests with JSON like: {"query": "user question"}
                // and responds with JSON like: {"answer": "bot answer"}
                const response = await fetch('/ask', { // Adjust URL if needed
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query }),
                });

                if (!response.ok) {
                    // Handle HTTP errors (like 404, 500)
                    const errorText = await response.text(); // Get error details if possible
                    throw new Error(`Network response was not ok (${response.status}): ${errorText}`);
                }

                const data = await response.json();

                if (data.answer) {
                    addMessage(data.answer, 'bot');
                } else {
                    addMessage("Received an empty answer from the backend.", 'error');
                }

            } catch (error) {
                console.error('Error sending message:', error);
                addMessage(`Error: Could not reach the Q&A service. Please ensure the backend is running. (${error.message})`, 'error');
            } finally {
                 // Re-enable input/button regardless of success or failure
                 userInput.disabled = false;
                 sendButton.disabled = false;
                 sendButton.textContent = 'Send';
                 userInput.focus(); // Set focus back to input
            }
        }

        // --- Event Listeners ---

        // Send message on button click
        sendButton.addEventListener('click', sendMessage);

        // Send message on Enter key press in the input field
        userInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent default form submission (if applicable)
                sendMessage();
            }
        });

        // Set focus to input field on load
         window.onload = () => {
            userInput.focus();
         }

    </script>

</body>
</html>
